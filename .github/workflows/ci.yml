# CI: Host-Build mit Unity-Tests und statischer Analyse, Firmware-Build
# mit ESP-IDF. Der Job für die Weboberfläche kommt in M9 dazu.
name: CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-24.04
    # Ein hängender Paketspiegel soll den Job nicht stundenlang blockieren (E-019)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build cppcheck gcovr

      # cppcheck gibt Funde als Workflow-Befehle aus. GitHub zeigt sie als
      # Annotationen am Commit, lesbar auch ohne Anmeldung (E-019).
      - name: Konfigurieren
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            "-DROF_CPPCHECK_TEMPLATE=::error file={file},line={line},col={column},title=cppcheck {id}::{severity}: {message}"

      - name: Bauen
        run: cmake --build build

      - name: Tests
        run: ctest --test-dir build --output-on-failure

      - name: cppcheck
        run: cmake --build build --target cppcheck

      - name: Abdeckung core/safety (100 Prozent Zweige)
        run: |
          cmake -S . -B build-cov -G Ninja -DCMAKE_BUILD_TYPE=Debug -DROF_COVERAGE=ON
          cmake --build build-cov
          cmake --build build-cov --target coverage

      # docs/api.yaml ist die einzige Quelle der Schnittstelle (API-01).
      # Version fest, Regeln in redocly.yaml (E-029).
      - name: OpenAPI prüfen
        run: npx --yes @redocly/cli@2.64.0 lint docs/api.yaml

  # Firmware mit fester ESP-IDF-Version im offiziellen Container (CI-04).
  # Die Version muss zu der passen, mit der lokal gebaut wird (E-031).
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v5

      # Im Container gehört das Repository einem anderen Benutzer. Ohne diese
      # Freigabe kann ESP-IDF die Projektversion nicht aus git lesen.
      - name: Firmware bauen
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py -C firmware build

      # ARC-04: firmware/net ruft weder core noch Treiber auf (E-042)
      - name: Symbole von firmware/net prüfen
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          B=firmware/build/esp-idf
          python3 test/include_rules/check_net_symbols.py --nm xtensa-esp32s3-elf-nm \
            --net $B/rof_net/librof_net.a \
            --forbidden $B/rof_core/librof_core.a $B/rof_platform_esp32/librof_platform_esp32.a \
              $B/espressif__onewire_bus/libespressif__onewire_bus.a $B/esp_driver_*/libesp_driver_*.a
